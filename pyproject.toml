[project]
name = "wrasse"
version = "0.1.0"
description = "Memory-conditioned agent negotiation with verified Base outcomes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.1,<2",
    "sibyl-memory-client==0.8.0",
    "web3>=7.13,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
]

[project.scripts]
wrasse = "wrasse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["wrasse"]

[tool.coverage.report]
show_missing = true


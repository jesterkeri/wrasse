[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# The policy vectors are shared with the Python suite; read-only access to that one file.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[invariant]
runs = 64
depth = 48
fail_on_revert = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

